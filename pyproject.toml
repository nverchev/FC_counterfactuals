[project]
name = "fc-counterfactuals"
version = "2.0"
description = "Counterfactual functional connectomes for neurological classifier selection."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "drytorch>=0.1.0",
    "hydra-core>=1.3.2",
    "joblib>=1.4.0",
    "matplotlib>=3.9.0",
    "nilearn>=0.11.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.18.0",
    "torch>=2.7.0",
    "tqdm>=4.66.5",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
track_all = [
    "tensorboard>=2.20.0",
    "wandb>=0.23.1",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff==0.17.1",
    "scikit-learn-stubs>=0.0.3",
]

[tool.basedpyright]
exclude = ["tests", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.uv.sources]
drytorch = { path = "../drytorch", editable = true }
