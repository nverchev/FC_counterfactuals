# User settings

seed: null  # null = unset

# Compute
device: auto  # auto = the available accelerator
torch_compile: false
n_workers: 0

# Checkpointing
checkpoint_every: 0  # 0 = only at the end of training
load: 0  # 0 = start from scratch, -1 = the latest checkpoint
run_id: null  # null = the last run

# Trackers
trackers:
  hydra: true
  tensorboard: false
  wandb: true
  sqlalchemy: false
  csv: false

# Plotting
plot:
  sample_indices: [0]
